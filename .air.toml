root = "."
tmp_dir = "tmp"
env_file = [".env"]

[build]
  cmd = "go build -o ./tmp/main ./cmd/api/main.go"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  
  # ✅ CRITICAL: Send SIGINT so your Go server can catch it and shutdown
  send_interrupt = true
  
  # ✅ CRITICAL: Stop old binary if build fails
  stop_on_error = true
  
  # ✅ Give time for graceful shutdown before force kill
  kill_delay = "2s"

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  # ✅ Clean up tmp on exit
  clean_on_exit = true